<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester Notepad</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">TESTER NOTEPAD</h1>
          <span class="brand-subtitle">QA WORKSPACE</span>
        </div>
      </div>
      <button class="open-tab-btn" id="btn-toggle-page-drawer" title="Toggle On-Page Drawer">
        Page Drawer
      </button>
    </header>

    <!-- Top Priority Tier: Server Codes (Beda Kasta) -->
    <div class="server-box">
      <div class="server-box-header">
        <span class="server-box-title">SERVER CODES</span>
        <span class="server-box-badge">TOP TIER</span>
      </div>
      <div class="server-input-row">
        <input type="text" id="popup-server-input" placeholder="Paste server code / host / URL..." />
        <button class="btn-copy" id="popup-btn-add-server">+ Add</button>
      </div>
      <div class="server-scroll" id="popup-server-container">
        <!-- Injected via JS -->
      </div>
    </div>

    <div class="tier-separator"></div>

    <div class="section-tag-row">
      <span>CREDENTIALS</span>
    </div>

    <!-- Search Credentials -->
    <div class="search-bar">
      <input type="text" id="popup-search" placeholder="Search email..." />
    </div>

    <!-- Accounts List -->
    <div class="accounts-scroll" id="accounts-container">
      <!-- Injected via JS -->
    </div>

    <!-- Quick Footer -->
    <footer class="popup-footer">
      <div class="toggle-row">
        <span>In-Page Floating Icon</span>
        <label class="switch">
          <input type="checkbox" id="toggle-floating-icon">
          <span class="slider round"></span>
        </label>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast">Copied</div>
  <script src="popup.js"></script>
</body>
</html>
